<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบลงทะเบียนนักกีฬาวอลเลย์บอลสีฟ้า</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Prompt Font -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background: linear-gradient(180deg, #b9e6fe 0%, #dbeafe 40%, #e0f2fe 100%);
            min-height: 100vh;
        }
        .soft-card {
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 10px 30px -5px rgba(14, 165, 233, 0.12), 0 4px 12px rgba(0, 0, 0, 0.03);
        }
        .radio-card:has(input:checked) {
            border-color: #0284c7;
            background-color: #f0f9ff;
            color: #0369a1;
        }
    </style>
</head>
<body class="p-4 md:p-10 text-slate-700">

    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Header Section -->
        <header class="text-center py-7 px-6 soft-card rounded-3xl border border-white">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-sky-500 text-white shadow-lg shadow-sky-300/50 mb-3">
                <i class="fa-solid fa-volleyball text-3xl"></i>
            </div>
            <h1 class="text-3xl md:text-4xl font-extrabold text-sky-900 tracking-tight mb-2">
                วอลเลย์บอลสีฟ้า
            </h1>
            <div class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full text-xs md:text-sm font-medium bg-red-50 text-red-600 border border-red-100">
                <span>🏆</span> ระบบบันทึกรายชื่อนักกีฬาเรียลไทม์
                <span id="netBadge" class="inline-flex items-center text-xs font-semibold px-2 py-0.5 rounded-full bg-slate-100 text-slate-600">
                    <span id="netDot" class="w-1.5 h-1.5 mr-1 rounded-full bg-slate-400"></span> <span id="netTxt">กำลังเชื่อมต่อ...</span>
                </span>
            </div>
        </header>

        <!-- Form Card -->
        <section class="soft-card rounded-3xl p-6 md:p-8 border border-white">
            <h2 class="text-lg md:text-xl font-bold text-sky-900 mb-6 flex items-center gap-2 border-b border-sky-100 pb-4">
                <i class="fa-solid fa-user-plus text-sky-500"></i>
                ลงทะเบียนนักกีฬา
            </h2>
            
            <form id="athleteForm" class="space-y-6" onsubmit="saveAthlete(event)">
                <!-- Input Fields (3 Column Layout) -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label for="fullName" class="block text-xs font-bold text-slate-600 mb-1.5">
                            <i class="fa-solid fa-user text-sky-500 mr-1"></i> ชื่อ - นามสกุล <span class="text-red-500">*</span>
                        </label>
                        <input type="text" id="fullName" required placeholder="เช่น สมชาย ใจดี"
                            class="w-full px-4 py-2.5 text-sm rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-sky-400 focus:border-transparent transition bg-slate-50/50 focus:bg-white">
                    </div>

                    <div>
                        <label for="classLevel" class="block text-xs font-bold text-slate-600 mb-1.5">
                            <i class="fa-solid fa-graduation-cap text-sky-500 mr-1"></i> ชั้น/ห้อง <span class="text-red-500">*</span>
                        </label>
                        <input type="text" id="classLevel" required placeholder="เช่น ม.3/1"
                            class="w-full px-4 py-2.5 text-sm rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-sky-400 focus:border-transparent transition bg-slate-50/50 focus:bg-white">
                    </div>

                    <div>
                        <label for="studentNo" class="block text-xs font-bold text-slate-600 mb-1.5">
                            <i class="fa-solid fa-hashtag text-sky-500 mr-1"></i> เลขที่ <span class="text-red-500">*</span>
                        </label>
                        <input type="number" id="studentNo" min="1" required placeholder="เช่น 15"
                            class="w-full px-4 py-2.5 text-sm rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-sky-400 focus:border-transparent transition bg-slate-50/50 focus:bg-white">
                    </div>
                </div>

                <!-- Category Radio Group -->
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-2">
                        <i class="fa-solid fa-users text-sky-500 mr-1"></i> เลือกประเภทผู้สมัคร <span class="text-red-500">*</span>
                    </label>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <label class="radio-card relative flex items-center p-3 rounded-xl border border-slate-200 cursor-pointer hover:border-sky-300 transition bg-white">
                            <input type="radio" name="category" value="ม.ต้นชาย" required class="w-4 h-4 text-sky-600 focus:ring-sky-400">
                            <span class="ml-2 text-xs md:text-sm font-semibold text-slate-700 flex items-center gap-1.5">
                                <i class="fa-solid fa-mars text-sky-500"></i> ม.ต้นชาย
                            </span>
                        </label>
                        
                        <label class="radio-card relative flex items-center p-3 rounded-xl border border-slate-200 cursor-pointer hover:border-sky-300 transition bg-white">
                            <input type="radio" name="category" value="ม.ปลายชาย" class="w-4 h-4 text-sky-600 focus:ring-sky-400">
                            <span class="ml-2 text-xs md:text-sm font-semibold text-slate-700 flex items-center gap-1.5">
                                <i class="fa-solid fa-mars text-indigo-500"></i> ม.ปลายชาย
                            </span>
                        </label>
                        
                        <label class="radio-card relative flex items-center p-3 rounded-xl border border-slate-200 cursor-pointer hover:border-sky-300 transition bg-white">
                            <input type="radio" name="category" value="ทั่วไปหญิง" class="w-4 h-4 text-sky-600 focus:ring-sky-400">
                            <span class="ml-2 text-xs md:text-sm font-semibold text-slate-700 flex items-center gap-1.5">
                                <i class="fa-solid fa-venus text-pink-500"></i> ทั่วไปหญิง
                            </span>
                        </label>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="pt-2">
                    <button type="submit"
                        class="w-full py-3 bg-gradient-to-r from-sky-400 to-blue-500 hover:from-sky-500 hover:to-blue-600 text-white font-bold text-sm rounded-xl shadow-md shadow-sky-300/50 active:scale-[0.99] transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                        บันทึกข้อมูลเรียลไทม์
                    </button>
                </div>
            </form>
        </section>

        <!-- Categories & Result Section -->
        <section class="space-y-4">
            <div class="flex items-center justify-between px-1">
                <h2 class="text-base md:text-lg font-bold text-sky-950 flex items-center gap-2">
                    <i class="fa-solid fa-bars-staggered text-sky-600"></i>
                    รายชื่อนักกีฬาแบ่งตามประเภท
                </h2>
                <span id="totalCount" class="text-xs font-bold bg-sky-600 text-white px-3 py-1 rounded-full shadow-sm">
                    รวมทั้งหมด: 0 คน
                </span>
            </div>

            <!-- Categories Display Grid -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                
                <!-- Category 1: ม.ต้นชาย -->
                <div class="soft-card rounded-2xl overflow-hidden border border-white flex flex-col">
                    <div class="bg-sky-500 px-4 py-3 text-white flex justify-between items-center">
                        <h3 class="font-bold text-sm flex items-center gap-1.5">
                            <i class="fa-solid fa-user text-xs"></i> ม.ต้นชาย
                        </h3>
                        <span id="count-ม.ต้นชาย" class="bg-white/20 text-white font-bold text-xs px-2.5 py-0.5 rounded-full">
                            0 คน
                        </span>
                    </div>
                    <div class="p-3 flex-1 min-h-[160px]">
                        <ul id="list-ม.ต้นชาย" class="space-y-2">
                            <!-- Items will be rendered here -->
                        </ul>
                    </div>
                </div>

                <!-- Category 2: ม.ปลายชาย -->
                <div class="soft-card rounded-2xl overflow-hidden border border-white flex flex-col">
                    <div class="bg-blue-600 px-4 py-3 text-white flex justify-between items-center">
                        <h3 class="font-bold text-sm flex items-center gap-1.5">
                            <i class="fa-solid fa-user text-xs"></i> ม.ปลายชาย
                        </h3>
                        <span id="count-ม.ปลายชาย" class="bg-white/20 text-white font-bold text-xs px-2.5 py-0.5 rounded-full">
                            0 คน
                        </span>
                    </div>
                    <div class="p-3 flex-1 min-h-[160px]">
                        <ul id="list-ม.ปลายชาย" class="space-y-2">
                            <!-- Items will be rendered here -->
                        </ul>
                    </div>
                </div>

                <!-- Category 3: ทั่วไปหญิง -->
                <div class="soft-card rounded-2xl overflow-hidden border border-white flex flex-col">
                    <div class="bg-pink-500 px-4 py-3 text-white flex justify-between items-center">
                        <h3 class="font-bold text-sm flex items-center gap-1.5">
                            <i class="fa-solid fa-user text-xs"></i> ทั่วไปหญิง
                        </h3>
                        <span id="count-ทั่วไปหญิง" class="bg-white/20 text-white font-bold text-xs px-2.5 py-0.5 rounded-full">
                            0 คน
                        </span>
                    </div>
                    <div class="p-3 flex-1 min-h-[160px]">
                        <ul id="list-ทั่วไปหญิง" class="space-y-2">
                            <!-- Items will be rendered here -->
                        </ul>
                    </div>
                </div>

            </div>
        </section>

    </div>

    <!-- Shared realtime engine (Firebase Realtime Database, REST + SSE) -->
    <script>
        /* >>> ลิงก์ฐานข้อมูล Firebase ของคุณ (ถ้าเว้นว่าง จะเก็บในเครื่องนี้เท่านั้น) */
        var DB_URL = "https://bluevolleyball-ad6cf-default-rtdb.firebaseio.com";

        var CATS = ['ม.ต้นชาย', 'ม.ปลายชาย', 'ทั่วไปหญิง'];
        var STORAGE_KEY = 'volleyball_blue_team_data';
        var data = {};          // id -> athlete
        var loaded = false, lastSig = '';

        function setNet(state, txt) {
            var b = document.getElementById('netBadge'), d = document.getElementById('netDot');
            var c = {
                live: ['bg-emerald-100 text-emerald-700', 'bg-emerald-500 animate-pulse'],
                wait: ['bg-amber-100 text-amber-700', 'bg-amber-500'],
                local: ['bg-slate-100 text-slate-600', 'bg-slate-400']
            }[state];
            b.className = 'inline-flex items-center text-xs font-semibold px-2 py-0.5 rounded-full ' + c[0];
            d.className = 'w-1.5 h-1.5 mr-1 rounded-full ' + c[1];
            document.getElementById('netTxt').textContent = txt;
        }

        function api(path) { return DB_URL.replace(/\/+$/, '') + '/athletes' + path + '.json'; }
        function saveLocal() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {} }

        function saveAthlete(event) {
            event.preventDefault();
            var fullName = document.getElementById('fullName').value.trim();
            var classLevel = document.getElementById('classLevel').value.trim();
            var studentNo = document.getElementById('studentNo').value.trim();
            var cat = document.querySelector('input[name="category"]:checked');
            if (!fullName || !classLevel || !studentNo || !cat) return;

            var id = Date.now() + '-' + Math.random().toString(36).slice(2, 6);
            var item = { id: id, fullName: fullName, classLevel: classLevel, studentNo: studentNo, category: cat.value };
            data[id] = item;
            document.getElementById('athleteForm').reset();
            renderLists();
            if (!DB_URL) { saveLocal(); return; }
            fetch(api('/' + id), { method: 'PUT', body: JSON.stringify(item) })
                .then(function (r) { if (!r.ok) throw 0; })
                .catch(function () { delete data[id]; renderLists(); alert('บันทึกไม่สำเร็จ กรุณาลองใหม่อีกครั้ง'); });
        }

        function deleteAthlete(id) {
            if (!confirm('คุณต้องการลบรายชื่อนักกีฬาท่านนี้หรือไม่? (ทุกคนจะเห็นว่าถูกลบ)')) return;
            var old = data[id];
            delete data[id];
            renderLists();
            if (!DB_URL) { saveLocal(); return; }
            fetch(api('/' + id), { method: 'DELETE' })
                .then(function (r) { if (!r.ok) throw 0; })
                .catch(function () { if (old) data[id] = old; renderLists(); alert('ลบไม่สำเร็จ กรุณาลองใหม่อีกครั้ง'); });
        }

        function sorted() {
            return Object.keys(data).map(function (k) { return data[k]; })
                .filter(function (a) { return a && a.category; })
                .sort(function (x, y) { return (parseInt(x.id) || 0) - (parseInt(y.id) || 0); });
        }

        function renderLists() {
            var athletes = sorted();
            var sig = loaded + JSON.stringify(athletes);
            if (sig === lastSig) return;           // nothing changed -> don't touch the DOM
            lastSig = sig;
            var total = 0;
            CATS.forEach(function (category) {
                var listContainer = document.getElementById('list-' + category);
                var countBadge = document.getElementById('count-' + category);
                var filtered = athletes.filter(function (a) { return a.category === category; });
                total += filtered.length;
                countBadge.textContent = filtered.length + ' คน';
                if (filtered.length === 0) {
                    listContainer.innerHTML = '<div class="py-8 text-center text-slate-300 text-xs font-normal">' +
                        (loaded ? 'ยังไม่มีรายชื่อ' : 'กำลังโหลดข้อมูล...') + '</div>';
                } else {
                    listContainer.innerHTML = filtered.map(function (item, idx) {
                        return '<li class="p-2.5 bg-slate-50 rounded-xl border border-slate-100 flex items-center justify-between hover:bg-white hover:shadow-sm transition">' +
                            '<div class="space-y-0.5">' +
                            '<div class="font-bold text-xs text-slate-800 flex items-center gap-1.5">' +
                            '<span class="w-4 h-4 bg-sky-100 text-sky-700 text-[10px] rounded-full flex items-center justify-center font-bold">' + (idx + 1) + '</span>' +
                            escapeHtml(item.fullName) + '</div>' +
                            '<div class="text-[11px] text-slate-400 pl-5">' + escapeHtml(item.classLevel) + ' • เลขที่ ' + escapeHtml(item.studentNo) + '</div>' +
                            '</div>' +
                            '<button onclick="deleteAthlete(\'' + escapeHtml(item.id) + '\')" class="text-slate-300 hover:text-red-500 p-1 rounded-md transition" title="ลบข้อมูล">' +
                            '<i class="fa-solid fa-trash-can text-xs"></i></button></li>';
                    }).join('');
                }
            });
            document.getElementById('totalCount').textContent = 'รวมทั้งหมด: ' + total + ' คน';
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, function (m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        function connect() {
            if (!DB_URL) {
                try { data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch (e) { data = {}; }
                if (Array.isArray(data)) { var o = {}; data.forEach(function (a) { o[a.id] = a; }); data = o; }
                loaded = true; setNet('local', 'ออฟไลน์ (เครื่องนี้เท่านั้น)'); renderLists(); return;
            }
            var es = new EventSource(api(''));
            es.onopen = function () { setNet('live', 'ออนไลน์'); };
            es.onerror = function () { setNet('wait', 'กำลังเชื่อมต่อใหม่...'); };
            function onData(ev) {
                try {
                    var m = JSON.parse(ev.data), path = m.path || '/', d = m.data;
                    if (path === '/') {
                        data = (ev.type === 'put' ? d : Object.assign(data, d)) || {};
                    } else {
                        var id = path.split('/').filter(Boolean)[0];
                        var rest = path.split('/').filter(Boolean).length > 1;
                        if (rest) { data[id] = Object.assign(data[id] || {}, { [path.split('/').filter(Boolean)[1]]: d }); }
                        else if (d === null) delete data[id];
                        else data[id] = ev.type === 'patch' ? Object.assign(data[id] || {}, d) : d;
                    }
                    loaded = true; renderLists();
                } catch (e) {}
            }
            es.addEventListener('put', onData);
            es.addEventListener('patch', onData);
        }

        window.onload = function () { renderLists(); connect(); };
    </script>
</body>
</html>
